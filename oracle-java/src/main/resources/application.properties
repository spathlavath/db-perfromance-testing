# Server Configuration
server.port=${PORT:3000}

# Oracle Database Configuration
oracle.user=${ORACLE_USER}
oracle.password=${ORACLE_PASSWORD}
oracle.connect-string=${ORACLE_CONNECT_STRING}

# Connection Pool Configuration
pool.min=${POOL_MIN:2}
pool.max=${POOL_MAX:10}
pool.timeout=${POOL_TIMEOUT:60}

# OpenTelemetry Configuration
otel.service.name=${OTEL_SERVICE_NAME:HR-Portal}
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
otel.exporter.otlp.timeout=${OTEL_EXPORTER_OTLP_TIMEOUT:30000}
otel.bsp.schedule.delay=${OTEL_BSP_SCHEDULE_DELAY:5000}
otel.bsp.max.queue.size=${OTEL_BSP_MAX_QUEUE_SIZE:2048}
otel.bsp.max.export.batch.size=${OTEL_BSP_MAX_EXPORT_BATCH_SIZE:512}
otel.metric.export.interval=${OTEL_METRIC_EXPORT_INTERVAL:60000}

# Logging
logging.level.root=${LOG_LEVEL:info}
logging.level.com.oracle.test=info
logging.level.org.springframework.jdbc=debug

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
