#
# New Relic Java Agent Configuration
# For full configuration options, see: https://docs.newrelic.com/docs/apm/agents/java-agent/configuration/java-agent-configuration-config-file/
#

# Common settings
common: &default_settings
  # License key (can be overridden by NEW_RELIC_LICENSE_KEY environment variable)
  license_key: '<%= ENV["NEW_RELIC_LICENSE_KEY"] %>'

  # Application name (can be overridden by NEW_RELIC_APP_NAME environment variable)
  app_name: <%= ENV["NEW_RELIC_APP_NAME"] || "Oracle-HR-Portal-Java" %>

  # Host (collector endpoint, can be overridden by NEW_RELIC_HOST environment variable)
  host: <%= ENV["NEW_RELIC_HOST"] || "collector.newrelic.com" %>

  # Audit mode for debugging (logs all data sent to New Relic)
  audit_mode: false

  # Log settings
  log_level: <%= ENV["NEW_RELIC_LOG_LEVEL"] || "info" %>

  # Log to console (stdout)
  log_file_name: STDOUT

  # Enable distributed tracing
  distributed_tracing:
    enabled: true

  # Enable span events
  span_events:
    enabled: true
    max_samples_stored: 2000

  # Application logging
  application_logging:
    enabled: true
    forwarding:
      enabled: true
      max_samples_stored: 10000
    local_decorating:
      enabled: true
    metrics:
      enabled: true

  # Transaction tracer
  transaction_tracer:
    enabled: true
    transaction_threshold: apdex_f
    record_sql: obfuscated
    stack_trace_threshold: 0.1
    explain_enabled: true
    explain_threshold: 0.1
    sql_metadata_comments: nr_service_guid

  # Error collector
  error_collector:
    enabled: true
    ignore_errors: ""
    ignore_status_codes: 404

  # Thread profiler
  thread_profiler:
    enabled: true

  # Browser monitoring
  browser_monitoring:
    auto_instrument: false

  # Cross application tracer
  cross_application_tracer:
    enabled: false

  # SQL statement configuration
  slow_sql:
    enabled: true

  # Database tracer
  datastore_tracer:
    enabled: true
    instance_reporting:
      enabled: true
    database_name_reporting:
      enabled: true

# Environment specific settings can override common settings
development:
  <<: *default_settings
  app_name: Employees (Development)

test:
  <<: *default_settings
  app_name: Employees (Test)

production:
  <<: *default_settings
  app_name: Employees (Production)

staging:
  <<: *default_settings
  app_name: Employees (Staging)
