version: '3.8'

services:
  oracle-test-app:
    build:
      context: ./services
      dockerfile: Dockerfile
    environment:
      - ORACLE_USER=${ORACLE_USER}
      - ORACLE_PASSWORD=${ORACLE_PASSWORD}
      - ORACLE_CONNECT_STRING=${ORACLE_CONNECT_STRING}
      - POOL_MIN=${POOL_MIN:-2}
      - POOL_MAX=${POOL_MAX:-10}
      - POOL_INCREMENT=${POOL_INCREMENT:-1}
      - POOL_TIMEOUT=${POOL_TIMEOUT:-60}
      - PORT=${PORT:-3000}
      - AUTO_RUN=${AUTO_RUN:-false}
      - TEST_INTENSITY=${TEST_INTENSITY:-medium}
      - TEST_DURATION=${TEST_DURATION:-600}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # OpenTelemetry Configuration - All OTLP settings
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-HR-Portal}
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      - OTEL_EXPORTER_OTLP_COMPRESSION=${OTEL_EXPORTER_OTLP_COMPRESSION:-gzip}
      - OTEL_EXPORTER_OTLP_TIMEOUT=${OTEL_EXPORTER_OTLP_TIMEOUT:-30000}
      # Attribute limits
      - OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT=${OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT:-4095}
      - OTEL_ATTRIBUTE_COUNT_LIMIT=${OTEL_ATTRIBUTE_COUNT_LIMIT:-128}
      - OTEL_SPAN_ATTRIBUTE_COUNT_LIMIT=${OTEL_SPAN_ATTRIBUTE_COUNT_LIMIT:-128}
      - OTEL_SPAN_EVENT_COUNT_LIMIT=${OTEL_SPAN_EVENT_COUNT_LIMIT:-128}
      - OTEL_SPAN_LINK_COUNT_LIMIT=${OTEL_SPAN_LINK_COUNT_LIMIT:-128}
      # Exporters
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-otlp}
      - OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-otlp}
      - OTEL_LOGS_EXPORTER=${OTEL_LOGS_EXPORTER:-otlp}
      # Sampling
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-always_on}
      # Batch span processor
      - OTEL_BSP_SCHEDULE_DELAY=${OTEL_BSP_SCHEDULE_DELAY:-5000}
      - OTEL_BSP_MAX_QUEUE_SIZE=${OTEL_BSP_MAX_QUEUE_SIZE:-2048}
      - OTEL_BSP_MAX_EXPORT_BATCH_SIZE=${OTEL_BSP_MAX_EXPORT_BATCH_SIZE:-512}
      - OTEL_BSP_EXPORT_TIMEOUT=${OTEL_BSP_EXPORT_TIMEOUT:-30000}
      # Metrics
      - OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE=${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:-delta}
      - OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION=${OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION:-base2_exponential_bucket_histogram}
      - OTEL_METRIC_EXPORT_INTERVAL=${OTEL_METRIC_EXPORT_INTERVAL:-60000}
      - OTEL_METRIC_EXPORT_TIMEOUT=${OTEL_METRIC_EXPORT_TIMEOUT:-30000}
      # Logs batch processor
      - OTEL_BLRP_SCHEDULE_DELAY=${OTEL_BLRP_SCHEDULE_DELAY:-5000}
      - OTEL_BLRP_MAX_QUEUE_SIZE=${OTEL_BLRP_MAX_QUEUE_SIZE:-2048}
      - OTEL_BLRP_MAX_EXPORT_BATCH_SIZE=${OTEL_BLRP_MAX_EXPORT_BATCH_SIZE:-512}
      - OTEL_BLRP_EXPORT_TIMEOUT=${OTEL_BLRP_EXPORT_TIMEOUT:-30000}
      # Semantic conventions
      - OTEL_SEMCONV_STABILITY_OPT_IN=${OTEL_SEMCONV_STABILITY_OPT_IN:-http}
      - OTEL_LOG_LEVEL=${OTEL_LOG_LEVEL:-info}
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - oracle-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 0  # Unlimited restarts for continuous demo
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 60s

  k6:
    image: grafana/k6:latest
    volumes:
      - ./k6/scripts:/scripts
      - ./k6/results:/results
    environment:
      - BASE_URL=http://oracle-test-app:3000
      - LOG_LEVEL=${K6_LOG_LEVEL:-INFO}
      - DETAILED_RESPONSE_LOGGING=${K6_DETAILED_LOGGING:-false}
      - LOG_SLOW_REQUESTS_MS=${K6_LOG_SLOW_REQUESTS_MS:-5000}
    depends_on:
      oracle-test-app:
        condition: service_healthy
    networks:
      - oracle-network
    # Run HR portal load test (removed sh -c which causes error)
    command: run /scripts/load-test.js

networks:
  oracle-network:
    driver: bridge
